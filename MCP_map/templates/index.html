<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Travel Agent - 智能旅行规划</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/dist/highlight.min.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <i class="fas fa-map-marked-alt"></i>
            <span class="brand">MCP Travel Agent</span>
        </div>
        <div class="topbar-center">
            <div class="search-box">
                <input id="queryInput" type="text" placeholder="输入旅行需求，如: 安庆两日游，预算2000，喜欢历史文化..." />
                <button id="planBtn" onclick="startPlan()"><i class="fas fa-magic"></i> AI 规划</button>
            </div>
        </div>
        <div class="topbar-right">
            <button class="tab-btn active" data-tab="map" onclick="switchTab('map')"><i class="fas fa-map"></i> 地图</button>
            <button class="tab-btn" data-tab="journal" onclick="switchTab('journal')"><i class="fas fa-book-open"></i> 游记</button>
        </div>
    </header>

    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingText">Agent 正在规划中...</p>
            <div class="loading-steps" id="loadingSteps"></div>
        </div>
    </div>

    <div class="main-wrapper">
        <div id="tabMap" class="tab-content active">
            <div class="layout-row">
                <aside class="sidebar" id="sidebar">
                    <div class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-chevron-left"></i></div>
                    <div class="panel" id="panelPlan">
                        <h3><i class="fas fa-clipboard-list"></i> AI 行程规划</h3>
                        <div id="planContent" class="plan-content"><p class="empty-hint">输入需求，点击 "AI 规划" 开始</p></div>
                    </div>
                    <div class="panel" id="panelWaypoints">
                        <h3><i class="fas fa-route"></i> 途经点 <button class="btn-sm" onclick="addWaypointDialog()"><i class="fas fa-plus"></i></button></h3>
                        <div id="waypointList" class="waypoint-list"><p class="empty-hint">暂无途经点</p></div>
                        <div class="panel-actions">
                            <select id="routeMode">
                                <option value="driving">驾车</option><option value="walking">步行</option>
                                <option value="bicycling">骑行</option><option value="transit">公交</option>
                            </select>
                            <button class="btn-primary" id="routePlanBtn" onclick="planRoutes()"><i class="fas fa-directions"></i> 规划路线</button>
                        </div>
                        <div id="routeInfoPanel" class="route-info-panel" style="display:none;"></div>
                    </div>
                    <div class="panel" id="panelLayers">
                        <h3><i class="fas fa-layer-group"></i> 地图图层</h3>
                        <div class="layer-controls">
                            <label class="layer-toggle"><input type="checkbox" id="toggleAttractions" checked onchange="toggleLayer('attraction')"><span class="layer-dot" style="background:#4F6AF6;"></span> 景点 <span class="layer-count" id="countAttractions">0</span></label>
                            <label class="layer-toggle"><input type="checkbox" id="toggleRestaurants" checked onchange="toggleLayer('restaurant')"><span class="layer-dot" style="background:#F97316;"></span> 餐厅 <span class="layer-count" id="countRestaurants">0</span></label>
                            <label class="layer-toggle"><input type="checkbox" id="toggleHotels" checked onchange="toggleLayer('hotel')"><span class="layer-dot" style="background:#10B981;"></span> 酒店 <span class="layer-count" id="countHotels">0</span></label>
                            <label class="layer-toggle"><input type="checkbox" id="toggleRoutes" checked onchange="toggleRouteLayer()"><span class="layer-dot" style="background:#8B5CF6;"></span> 路线</label>
                        </div>
                    </div>
                    <div class="panel" id="panelWeather" style="display:none;">
                        <h3><i class="fas fa-cloud-sun"></i> 天气预报</h3>
                        <div id="weatherContent"></div>
                    </div>
                    <div class="panel" id="panelItinerary" style="display:none;">
                        <h3><i class="fas fa-route"></i> 每日行程清单</h3>
                        <div id="itineraryContent" class="itinerary-list"></div>
                    </div>
                </aside>
                <div class="map-container" id="mapContainer"></div>
            </div>
        </div>

        <div id="tabJournal" class="tab-content">
            <div class="journal-wrapper">
                <div class="journal-header">
                    <h2><i class="fas fa-feather-alt"></i> 旅行游记</h2>
                    <div class="journal-actions">
                        <button class="btn-primary" onclick="addJournalEntry()"><i class="fas fa-plus"></i> 添加</button>
                        <button class="btn-outline" onclick="exportJournal()"><i class="fas fa-download"></i> 导出</button>
                    </div>
                </div>
                <div class="journal-timeline" id="journalTimeline"><p class="empty-hint">AI 规划后将自动生成游记框架，你也可以手动添加</p></div>
            </div>
        </div>
    </div>

    <div id="addWpDialog" class="modal" style="display:none;">
        <div class="modal-body"><h3>添加途经点</h3><input id="wpSearchInput" type="text" placeholder="搜索地点..." /><div id="wpSearchResults" class="search-results"></div><div class="modal-footer"><button class="btn-outline" onclick="closeWpDialog()">取消</button></div></div>
    </div>
    <div id="editEntryDialog" class="modal" style="display:none;">
        <div class="modal-body modal-lg"><h3>编辑游记条目</h3><input type="hidden" id="editEntryId" />
            <div class="form-row"><label>时间</label><input id="editEntryTime" type="time" /></div>
            <div class="form-row"><label>标题</label><input id="editEntryTitle" type="text" /></div>
            <div class="form-row"><label>内容</label><textarea id="editEntryContent" rows="6"></textarea></div>
            <div class="modal-footer"><button class="btn-outline" onclick="closeEditEntry()">取消</button><button class="btn-primary" onclick="saveEditEntry()">保存</button></div>
        </div>
    </div>

    <!-- 地图底部高德版权标注 -->
    <div id="amapAttrib" class="amap-attrib">
        <img src="https://webapi.amap.com/theme/v1.3/logo@1x.png" alt="高德地图" style="height:16px;vertical-align:middle;" />
        <span>高德地图 &copy; AutoNavi</span>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
